name: Sync SDK to public repository

on:
  push:
    branches: [main]
    paths:
      - "sdks/typescript/**"
      - ".github/workflows/sync-sdk.yml"
  pull_request_target:
    branches: [main]

jobs:
  sync:
    if: ${{ (github.event_name == 'push' && github.repository == 'segmentationAPI/monorepo') || (github.event_name == 'pull_request_target' && github.repository == 'segmentationAPI/sdk') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync SDK subtree
        uses: olivr/copybara-action@v1.2.5
        with:
          ssh_key: ${{ secrets.SSH_KEY }}
          access_token: ${{ secrets.GH_TOKEN }}
          sot_repo: segmentationAPI/monorepo
          sot_branch: main
          destination_repo: segmentationAPI/sdk
          destination_branch: main
          workflow: ${{ github.event_name == 'pull_request_target' && 'pr' || 'push' }}
          pr_number: ${{ github.event.pull_request.number }}
          push_include: "sdks/typescript/** sdks/typescript/.github/workflows/publish.yml .github/workflows/sync-sdk.yml"
          push_move: |
            .github||sdks/typescript/.github||workflows/sync-sdk.yml
            sdks/typescript||
          pr_move: |
            ||sdks/typescript
            sdks/typescript/.github||.github||workflows/sync-sdk.yml
          committer: "GitHub Actions <actions@github.com>"
